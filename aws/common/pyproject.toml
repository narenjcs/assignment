[project]
name = "docintel-common"
version = "0.1.0"
description = "Shared helpers for DocIntel AWS Lambdas and AgentCore agents"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35", "strands-agents>=1.57"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docintel_common*"]
