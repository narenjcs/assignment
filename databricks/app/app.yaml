# Databricks Apps runtime config (consumed by the Apps platform, not by `databricks bundle`).
# `value_from` names must match resources[].name in ../resources/apps.yml — field name
# confirmed against the DAB `resources.AppEnvVar` schema (`databricks bundle schema`, CLI
# v0.292.0: properties name/value/value_from), which mirrors the Apps platform's native
# app.yaml format. UNVERIFIED offline beyond that: no workspace is available to actually
# `databricks apps deploy` against (see deploy report).
command:
  - 'uvicorn'
  - 'docintel_app.server:build_app'
  - '--factory'
  - '--host'
  - '0.0.0.0'
  - '--port'
  - '$DATABRICKS_APP_PORT'

# NOTE: DOCINTEL_CATALOG / DOCINTEL_SCHEMA are intentionally NOT set here. app.yaml is uploaded
# verbatim (no ${var.*} substitution), so hardcoding a catalog here silently pointed the app at a
# catalog that does not exist on a Default Storage workspace; startup then failed and the app
# served 502. They are set from bundle variables in ../resources/apps.yml instead.
# Environment. IMPORTANT: this file — not the bundle — is what the Apps platform reads. A
# `resources.apps.<app>.env` block in the bundle did NOT reach the deployed app (its config came
# back with an empty env list), so every var must be declared here. `value_from` names must match
# resources[].name in ../resources/apps.yml.
#
# The key is `valueFrom` (camelCase) — the Apps platform's own app.yaml spelling. The DAB
# schema uses snake_case `value_from` for its resource block, and using that spelling here is
# silently ignored: the var is set to an empty string and the app dies on startup validation.
#
# DOCINTEL_CATALOG/SCHEMA cannot use ${var.*} here (app.yaml is uploaded verbatim), so they must
# be kept in step with the bundle variables; scripts/deploy-databricks.sh fails the deploy if
# they diverge.
env:
  # Import docintel_app straight from the synced source (see requirements.txt): installing it
  # as a package made pip serve a cached wheel of an older revision.
  - name: 'PYTHONPATH'
    value: '/app/python/source_code/src'
  - name: 'DOCINTEL_CATALOG'
    value: 'workspace'
  - name: 'DOCINTEL_SCHEMA'
    value: 'docs'
  - name: 'AWS_SECRET_SCOPE'
    value: 'docintel'
  - name: 'DATABRICKS_WAREHOUSE_ID'
    valueFrom: 'sql-warehouse'
  - name: 'DATABRICKS_LLM_ENDPOINT'
    valueFrom: 'llm-endpoint'
  - name: 'AWS_GATEWAY_URL'
    valueFrom: 'aws-gateway-url'
  - name: 'AWS_MCP_TOKEN_URL'
    valueFrom: 'aws-mcp-token-url'
  - name: 'AWS_MCP_CLIENT_ID'
    valueFrom: 'aws-mcp-client-id'
  - name: 'AWS_MCP_CLIENT_SECRET'
    valueFrom: 'aws-mcp-client-secret'
  - name: 'AWS_MCP_SCOPE'
    valueFrom: 'aws-mcp-scope'
