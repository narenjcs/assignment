[project]
name = "docintel-app"
version = "0.1.0"
description = "DocIntel MCP server and PDF agent, deployed as a Databricks App."
requires-python = ">=3.12"
dependencies = [
    "mcp==2.1.1",
    "databricks-sdk==0.140.0",
    "pydantic==2.12.5",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "openai==3.19.0",
    "pypdf==6.19.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
